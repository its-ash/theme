<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live showcase of the theme Flutter component library.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="theme showcase">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>theme — component showcase</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #1b1b1f;
    }

    /*
      This app is a phone-shaped UI (shopping/blog/astrology demos), so on a
      wide desktop viewport it's framed like a phone instead of stretching
      full-bleed. Flutter web mounts its canvas/glass-pane as a direct child
      of <body>, so the frame is applied to body itself. Below the frame's
      own breakpoint it fills the viewport as normal, so real phones/tablets
      still get the full-screen experience.
    */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @media (min-width: 900px) and (min-height: 780px) {
      body {
        width: 412px;
        height: 900px;
        max-height: 92vh;
        margin: auto;
        border-radius: 40px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
        border: 10px solid #111;
        background: #fff;
      }
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
